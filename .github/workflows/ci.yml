name: CareerPilot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests-and-eval:
    name: Django Tests & CareerPilot Golden Eval Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ResumeAI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ResumeAI/requirements.txt

      - name: Install system audio and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks, full test suite & CareerPilot Golden Eval Gate
        env:
          DEBUG: "True"
          USE_POSTGRES: "false"
          GEMINI_API_KEY: ""
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py test Authentication Resume AI
          python manage.py run_llm_eval

  frontend-build-and-e2e:
    name: Next.js Build & Playwright Headless E2E Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-ai-next
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: resume-ai-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, and build Next.js application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
        run: npm run build

      - name: Install Playwright Chromium & execute E2E browser smoke suite
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          npx next start -p 3000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/studio > /dev/null; then break; fi
            sleep 1
          done
          node e2e/smoke.mjs
          kill $SERVER_PID || true
